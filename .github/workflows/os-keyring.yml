# Tests the real OS password stores (Windows Credential Manager, macOS Keychain, Linux
# Secret Service). Not part of CI's pass/fail: hosted runners' keychains vary, so a red
# run here is a prompt to look, not a blocked merge.
name: OS keyring

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/DbMigrator.Desktop.Platform/Credentials/**'
      - 'tests/DbMigrator.Desktop.Tests/Platform/**'
      - '.github/workflows/os-keyring.yml'

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DBMIGRATOR_TEST_OS_KEYRING: 1

jobs:
  keyring:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build tests/DbMigrator.Desktop.Tests -c Release

      - name: Test (Windows, macOS)
        if: runner.os != 'Linux'
        run: dotnet test --project tests/DbMigrator.Desktop.Tests --no-build -c Release -- --filter-class "*OsCredentialStoreTests"

      # A private D-Bus session with a fresh, unlocked GNOME Keyring.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gnome-keyring libsecret-1-0 dbus-x11
          cat > keyring-test.sh <<'SCRIPT'
          set -e
          export HOME="$(mktemp -d)"
          eval "$(printf 'ci-unlock' | gnome-keyring-daemon --unlock --components=secrets)"
          eval "$(gnome-keyring-daemon --start --components=secrets)"
          # The login keyring is created in the background; testing before it exists makes libsecret prompt.
          for i in $(seq 1 50); do [ -f "$HOME/.local/share/keyrings/login.keyring" ] && break; sleep 0.2; done
          dotnet test --project tests/DbMigrator.Desktop.Tests --no-build -c Release -- \
            --filter-class "*OsCredentialStoreTests" --filter-class "*LinuxSecretServiceAvailabilityTests"
          SCRIPT
          dbus-run-session -- sh keyring-test.sh
